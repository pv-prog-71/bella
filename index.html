<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Bella's Journey - a 2D platform adventure about a little dog finding her way home.">
  <meta name="theme-color" content="#070b10">
  <meta name="game-version" content="1.3.11">
  <title>Bella's Journey</title>
  <link rel="stylesheet" href="style.css">

  <div id="stage">
    <canvas id="game" width="960" height="540" tabindex="0" aria-label="Bella's Journey game canvas"></canvas>
